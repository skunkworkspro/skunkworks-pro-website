<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">May and Kit in a cyber-noir city</title>
  <desc id="desc">An editorial cyber-noir illustration of two lead characters standing close together against a futuristic Singapore and Bangkok inspired skyline, with negative space for website copy.</desc>
  <defs>
